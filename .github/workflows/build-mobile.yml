name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build with Expo EAS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.DEPLOY_BHASHAA }}
      - name: Install dependencies
        run: npm ci
      - name: Build APK on EAS
        run: eas build --platform android --profile production --non-interactive --wait --json > eas-build.json
      - name: Download APK from EAS
        shell: bash
        run: |
          BUILD_ID=$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('eas-build.json','utf8')); const b=Array.isArray(d)?d[0]:d; process.stdout.write(b.id || b.buildId)")
          eas build:download --build-id "$BUILD_ID" --non-interactive
          mkdir -p artifacts
          find . -maxdepth 1 -type f -name '*.apk' -exec mv {} artifacts/app.apk \;
      - name: Publish APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/app.apk
          if-no-files-found: error
